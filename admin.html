<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#db2777" />
  <meta name="robots" content="noindex, nofollow" />
  <title>لوحة الإدارة · تسجيل الدخول</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px;
      font-family: "Cairo", "Segoe UI", Tahoma, system-ui, sans-serif; color: #1f2937;
      background:
        radial-gradient(900px 460px at 100% -10%, #ffe4f1 0%, rgba(255,228,241,0) 62%),
        radial-gradient(760px 420px at -10% 6%, #fdf2f8 0%, rgba(253,242,248,0) 60%),
        #fff;
      text-align: center;
    }
    .card {
      width: min(100%, 360px); background: #fff; border: 1px solid #f3d9e5;
      border-radius: 24px; padding: 30px 22px;
      box-shadow: 0 30px 80px -50px rgba(157, 23, 77, .55);
    }
    .spinner {
      width: 58px; height: 58px; margin: 0 auto 16px; border-radius: 50%;
      background: conic-gradient(from 0deg, #fce7f3, #db2777, #fce7f3);
      display: grid; place-items: center; animation: spin 1.1s linear infinite;
    }
    .spinner::after { content: ""; width: 44px; height: 44px; border-radius: 50%; background: #fff; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { margin: 0 0 6px; font-size: 18px; font-weight: 900; }
    p { margin: 0 0 16px; font-size: 12.5px; font-weight: 600; line-height: 1.8; color: #6b7280; }
    a {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%; text-decoration: none; color: #fff; font-weight: 900; font-size: 13.5px;
      background: linear-gradient(135deg, #ec4899, #db2777 62%, #be185d);
      border-radius: 13px; padding: 12px 16px;
      box-shadow: 0 16px 30px -20px rgba(219, 39, 119, .95);
    }
  </style>
  <script>
    // The admin link the installer hands out. The dashboard itself lives in
    // index.html; this page only forwards to the manager login.
    location.replace('index.html?entry=admin');
  </script>
  <meta http-equiv="refresh" content="0;url=index.html?entry=admin" />
</head>
<body>
  <main class="card">
    <div class="spinner" aria-hidden="true"></div>
    <h1>جارٍ فتح لوحة الإدارة…</h1>
    <p>يتم تحويلك إلى صفحة تسجيل الدخول. إن لم يحدث تلقائيًا اضغطي الزر بالأسفل.</p>
    <a href="index.html?entry=admin">الدخول إلى لوحة الإدارة</a>
  </main>
</body>
</html>
